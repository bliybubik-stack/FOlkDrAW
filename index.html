<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Canvas · draw</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- toolbar – full width, fixed top -->
  <div id="toolbar" class="toolbar">
    <button data-tool="pen" class="active" aria-label="Pen">🖊️ Pen</button>
    <button data-tool="eraser" aria-label="Eraser">🧹 Eraser</button>
    <button data-tool="text" aria-label="Text">🔤 Text</button>
  </div>

  <!-- canvas container: white canvas fills remaining space -->
  <div id="canvas-wrapper">
    <canvas id="drawCanvas"></canvas>
  </div>

  <!-- optional text input (hidden, positioned absolute) -->
  <input type="text" id="textInput" placeholder="Type text…" autocomplete="off">

  <script src="app.js"></script>
</body>
</html>
